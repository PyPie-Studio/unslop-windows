name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Zip Bundle
        shell: pwsh
        run: |
          $zipName = "unslop-windows-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path unslop.bat, unslop.ps1, README.md, LICENSE, scripts, docs -DestinationPath $zipName -Force

      - name: Generate Cryptographic SHA-256 Checksums
        shell: pwsh
        run: |
          $zipName = "unslop-windows-$($env:GITHUB_REF_NAME).zip"
          $files = @($zipName, "unslop.ps1", "unslop.bat")
          $checksums = foreach ($file in $files) {
              $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $file"
          }
          $checksums | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content "SHA256SUMS.txt"

      - name: Upload Assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zipName = "unslop-windows-$($env:GITHUB_REF_NAME).zip"
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
              Write-Host "Updating existing release $env:GITHUB_REF_NAME with assets and checksums..."
              gh release upload $env:GITHUB_REF_NAME $zipName SHA256SUMS.txt --clobber
          } else {
              Write-Host "Creating new release $env:GITHUB_REF_NAME..."
              gh release create $env:GITHUB_REF_NAME $zipName SHA256SUMS.txt --generate-notes
          }
