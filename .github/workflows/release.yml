name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Quality Gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure Pester 5 Module Available
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester 5..."
            Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }

      - name: Run 7-Pillar Master Quality Gate
        shell: pwsh
        run: |
          ./scripts/Test-MasterGate.ps1 -TestResultsPath "test-results/pester-release.xml"

      - name: Publish Test Summary to GitHub Actions
        if: always()
        shell: pwsh
        run: |
          $xmlPath = "test-results/pester-release.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $total = $xml.'test-results'.total
            $failures = $xml.'test-results'.failures
            $notRun = $xml.'test-results'.'not-run'
            $passed = [int]$total - [int]$failures - [int]$notRun
            $suiteTime = $xml.'test-results'.'test-suite'.time
            
            $statusEmoji = if ([int]$failures -gt 0) { '❌ FAILED' } else { '✅ PASSED' }
            $summaryLines = @(
              "## 🛡️ Release Pre-Flight Pester Test Results ($statusEmoji)",
              "",
              "| Metric | Value |",
              "| :--- | :--- |",
              "| **Total Tests** | $total |",
              "| **Passed** | $passed |",
              "| **Failed** | $failures |",
              "| **Skipped / Not Run** | $notRun |",
              "| **Duration** | ${suiteTime}s |"
            )
            if ($env:GITHUB_STEP_SUMMARY) {
              ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            if ([int]$failures -gt 0) {
              foreach ($tc in $xml.SelectNodes("//test-case[@result='Failure']")) {
                $msg = $tc.failure.message.Trim() -replace '\r?\n', ' '
                Write-Host "::error file=tests/unslop.Tests.ps1,title=Pester Test Failure::$($tc.name): $msg"
              }
            }
          }

      - name: Upload Pester Test Results Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pester-results-release
          path: test-results/
          if-no-files-found: ignore

  publish-release:
    name: Build & Publish Release Assets
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package Zip Bundle
        shell: pwsh
        run: |
          $zipName = "unslop-windows-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path unslop.bat, unslop.ps1, README.md, LICENSE, scripts, docs, tests -DestinationPath $zipName -Force

      - name: Generate Cryptographic SHA-256 Checksums
        shell: pwsh
        run: |
          $zipName = "unslop-windows-$($env:GITHUB_REF_NAME).zip"
          $files = @($zipName, "unslop.ps1", "unslop.bat")
          $checksums = foreach ($file in $files) {
              $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $file"
          }
          $checksums | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content "SHA256SUMS.txt"

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            unslop-windows-${{ github.ref_name }}.zip
            SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $notesFile = "RELEASE_NOTES.md"
          
          if (Test-Path "CHANGELOG.md") {
              $changelog = Get-Content "CHANGELOG.md" -Raw
              $pattern = "(?s)## \[$version\].*?(?=(?:\r?\n## \[|\Z))"
              if ($changelog -match $pattern) {
                  $extracted = $matches[0].Trim()
                  $notesBody = ($extracted -replace "^##\s+\[.*?\]\s*-\s*\d{4}-\d{2}-\d{2}", "" -replace "\r?\n---\s*$", "").Trim()
                  
                  $header = "# 🛡️ unslop-windows $tag`n`n$notesBody`n`n---`n`n"
                  $footerLines = @(
                      "",
                      "## 📦 Quick Installation & Usage",
                      "",
                      "1. Download **``unslop-windows-$tag.zip``** from Assets below.",
                      "2. Extract the archive to any directory.",
                      "3. Right-click **``unslop.bat``** and choose **Run as administrator** (or double-click and accept the UAC elevation prompt).",
                      "4. Select an option from the interactive menu:",
                      "   - **[1] Full Debloat**: Purge OneDrive, telemetry, diagnostics & provisioned bloatware.",
                      "   - **[2] Dry-Run Audit**: Inspect all changes safely with zero system modifications.",
                      "   - **[3] Debloat, Keep Microsoft To-Do**: Full debloat preserving To-Do.",
                      "   - **[4] Debloat, Keep Xbox**: Full debloat preserving Xbox Identity Provider & gaming services.",
                      "   - **[5] Debloat, Keep OneDrive**: Full debloat preserving Microsoft OneDrive sync.",
                      "   - **[6] Debloat + Classic Context Menu**: Full debloat and restore Windows 10 classic context menu.",
                      "   - **[7] Custom Flags**: Supply custom switch combinations (e.g. ``-KeepTodos -KeepXbox -NoRestart``).",
                      "   - **[8] Full Restore / Undo**: Symmetrically revert all tweaks, services, tasks, and policies back to Windows defaults.",
                      "",
                      "---",
                      "",
                      "## 🔒 Verification & Integrity",
                      "Verify archive integrity using the published ``SHA256SUMS.txt``:",
                      "````powershell",
                      "Get-FileHash .\unslop-windows-$tag.zip -Algorithm SHA256",
                      "````"
                  )
                  $footer = $footerLines -join "`n"
                  Set-Content -Path $notesFile -Value ($header + $footer) -Encoding utf8
                  Write-Host "Successfully extracted release notes for $version"
                  Get-Content $notesFile
                  exit 0
              }
          }
          
          # Fallback if no matching changelog entry found
          Set-Content -Path $notesFile -Value "# 🛡️ unslop-windows $tag`n`nAutomated release bundle." -Encoding utf8

      - name: Upload Assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipName = "unslop-windows-$tag.zip"
          $notesFile = "RELEASE_NOTES.md"
          
          if (gh release view $tag 2>$null) {
              Write-Host "Updating existing release $tag with notes and assets..."
              if (Test-Path $notesFile) {
                  gh release edit $tag --notes-file $notesFile
              }
              gh release upload $tag $zipName SHA256SUMS.txt --clobber
          } else {
              Write-Host "Creating new release $tag..."
              if (Test-Path $notesFile) {
                  gh release create $tag $zipName SHA256SUMS.txt --title "$tag" --notes-file $notesFile
              } else {
                  gh release create $tag $zipName SHA256SUMS.txt --title "$tag" --generate-notes
              }
          }
