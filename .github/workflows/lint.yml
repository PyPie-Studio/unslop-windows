name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  doc-lint:
    name: Markdown Lint Audit
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Markdown Lint Audit
        shell: pwsh
        run: npx --yes markdownlint-cli "**/*.md"

  quality-gate-core:
    name: Quality Gate (${{ matrix.name }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win11
            gate_args: ""
            name: "Win11 Core (PS7)"
            artifact: "pester-results-pwsh"
            engine: "unslop-win11.ps1"
          - target: win10
            gate_args: "-Win10 -SkipBuildCheck"
            name: "Win10 Core (PS7)"
            artifact: "pester-results-win10-pwsh"
            engine: "unslop-win10.ps1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache PowerShell Modules
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/Documents/PowerShell/Modules
          key: windows-modules-${{ runner.os }}-pwsh-pester6-pssa-v1
          restore-keys: |
            windows-modules-${{ runner.os }}-pwsh-

      - name: Ensure Required Modules Available (Pester 6 & PSScriptAnalyzer)
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 6 } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester 6 for pwsh..."
            Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 6.0.0
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Write-Host "Installing PSScriptAnalyzer for pwsh..."
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run 7-Pillar Master Quality Gate
        shell: pwsh
        run: |
          ./scripts/Test-MasterGate.ps1 ${{ matrix.gate_args }} -Strict -TestResultsPath "test-results/pester-${{ matrix.target }}-pwsh.xml" -CodeCoveragePath "test-results/coverage-${{ matrix.target }}-pwsh.xml"

      - name: Publish Test Summary to GitHub Actions
        if: always()
        shell: pwsh
        run: |
          $xmlPath = "test-results/pester-${{ matrix.target }}-pwsh.xml"
          $covPath = "test-results/coverage-${{ matrix.target }}-pwsh.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $total = $xml.'test-results'.total
            $failures = $xml.'test-results'.failures
            $notRun = $xml.'test-results'.'not-run'
            $passed = [int]$total - [int]$failures - [int]$notRun
            $suiteTime = $xml.'test-results'.'test-suite'.time
            
            $status = if ([int]$failures -gt 0) { 'FAILED' } else { 'PASSED' }
            $summaryLines = @(
              "## Pester Unit Test Results: ${{ matrix.name }} ($status)",
              "",
              "| Metric | Value |",
              "| :--- | :--- |",
              "| **Total Tests** | $total |",
              "| **Passed** | $passed |",
              "| **Failed** | $failures |",
              "| **Skipped / Not Run** | $notRun |",
              "| **Duration** | ${suiteTime}s |"
            )

            if (Test-Path $covPath) {
              [xml]$covXml = Get-Content $covPath
              $lineNode = $covXml.report.counter | Where-Object { $_.type -eq 'LINE' }
              $instNode = $covXml.report.counter | Where-Object { $_.type -eq 'INSTRUCTION' }
              $lineCov = [int]$lineNode.covered
              $lineTotal = $lineCov + [int]$lineNode.missed
              $linePct = if ($lineTotal -gt 0) { [math]::Round(($lineCov / $lineTotal) * 100, 1) } else { 0 }
              $instCov = [int]$instNode.covered
              $instTotal = $instCov + [int]$instNode.missed
              $instPct = if ($instTotal -gt 0) { [math]::Round(($instCov / $instTotal) * 100, 1) } else { 0 }

              $summaryLines += @(
                "",
                "### Code Coverage: ${{ matrix.engine }}",
                "| Metric | Covered | Total | Coverage % |",
                "| :--- | :--- | :--- | :--- |",
                "| **Lines** | $lineCov | $lineTotal | ${linePct}% |",
                "| **Instructions** | $instCov | $instTotal | ${instPct}% |"
              )
            }

            if ($env:GITHUB_STEP_SUMMARY) {
              ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            if ([int]$failures -gt 0) {
              $defaultTestFile = if ('${{ matrix.target }}' -eq 'win10') { 'tests/unslop-win10.Tests.ps1' } else { 'tests/unslop-win11.Tests.ps1' }
              foreach ($tc in $xml.SelectNodes("//test-case[@result='Failure']")) {
                $msg = $tc.failure.message.Trim() -replace '\r?\n', ' '
                $testFile = if ($tc.file) {
                  $tc.file
                } elseif ($tc.ParentNode.name -match 'Tests\.ps1$') {
                  $tc.ParentNode.name
                } else {
                  $defaultTestFile
                }
                if ($testFile -match 'tests[\\/][^\\/]+\.Tests\.ps1') {
                  $testFile = $matches[0] -replace '\\', '/'
                }
                Write-Host "::error file=$testFile,title=Pester Test Failure::$($tc.name): $msg"
              }
            }
          }

      - name: Upload Pester Test Results & Coverage Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact }}
          path: test-results/
          if-no-files-found: ignore

  quality-gate-desktop:
    name: Quality Gate (${{ matrix.name }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win11
            gate_args: ""
            name: "Win11 Desktop (PS5.1)"
            artifact: "pester-results-powershell"
            engine: "unslop-win11.ps1"
          - target: win10
            gate_args: "-Win10 -SkipBuildCheck"
            name: "Win10 Desktop (PS5.1)"
            artifact: "pester-results-win10-powershell"
            engine: "unslop-win10.ps1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache PowerShell Modules
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/Documents/WindowsPowerShell/Modules
          key: windows-modules-${{ runner.os }}-powershell-pester6-pssa-v1
          restore-keys: |
            windows-modules-${{ runner.os }}-powershell-

      - name: Ensure Required Modules Available (Pester 6 & PSScriptAnalyzer)
        shell: powershell
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 6 } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester 6 for powershell..."
            Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 6.0.0
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Write-Host "Installing PSScriptAnalyzer for powershell..."
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run 7-Pillar Master Quality Gate
        shell: powershell
        run: |
          ./scripts/Test-MasterGate.ps1 ${{ matrix.gate_args }} -Strict -TestResultsPath "test-results/pester-${{ matrix.target }}-powershell.xml" -CodeCoveragePath "test-results/coverage-${{ matrix.target }}-powershell.xml"

      - name: Publish Test Summary to GitHub Actions
        if: always()
        shell: powershell
        run: |
          $xmlPath = "test-results/pester-${{ matrix.target }}-powershell.xml"
          $covPath = "test-results/coverage-${{ matrix.target }}-powershell.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $total = $xml.'test-results'.total
            $failures = $xml.'test-results'.failures
            $notRun = $xml.'test-results'.'not-run'
            $passed = [int]$total - [int]$failures - [int]$notRun
            $suiteTime = $xml.'test-results'.'test-suite'.time
            
            $status = if ([int]$failures -gt 0) { 'FAILED' } else { 'PASSED' }
            $summaryLines = @(
              "## Pester Unit Test Results: ${{ matrix.name }} ($status)",
              "",
              "| Metric | Value |",
              "| :--- | :--- |",
              "| **Total Tests** | $total |",
              "| **Passed** | $passed |",
              "| **Failed** | $failures |",
              "| **Skipped / Not Run** | $notRun |",
              "| **Duration** | ${suiteTime}s |"
            )

            if (Test-Path $covPath) {
              [xml]$covXml = Get-Content $covPath
              $lineNode = $covXml.report.counter | Where-Object { $_.type -eq 'LINE' }
              $instNode = $covXml.report.counter | Where-Object { $_.type -eq 'INSTRUCTION' }
              $lineCov = [int]$lineNode.covered
              $lineTotal = $lineCov + [int]$lineNode.missed
              $linePct = if ($lineTotal -gt 0) { [math]::Round(($lineCov / $lineTotal) * 100, 1) } else { 0 }
              $instCov = [int]$instNode.covered
              $instTotal = $instCov + [int]$instNode.missed
              $instPct = if ($instTotal -gt 0) { [math]::Round(($instCov / $instTotal) * 100, 1) } else { 0 }

              $summaryLines += @(
                "",
                "### Code Coverage: ${{ matrix.engine }}",
                "| Metric | Covered | Total | Coverage % |",
                "| :--- | :--- | :--- | :--- |",
                "| **Lines** | $lineCov | $lineTotal | ${linePct}% |",
                "| **Instructions** | $instCov | $instTotal | ${instPct}% |"
              )
            }

            if ($env:GITHUB_STEP_SUMMARY) {
              ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

            if ([int]$failures -gt 0) {
              $defaultTestFile = if ('${{ matrix.target }}' -eq 'win10') { 'tests/unslop-win10.Tests.ps1' } else { 'tests/unslop-win11.Tests.ps1' }
              foreach ($tc in $xml.SelectNodes("//test-case[@result='Failure']")) {
                $msg = $tc.failure.message.Trim() -replace '\r?\n', ' '
                $testFile = if ($tc.file) {
                  $tc.file
                } elseif ($tc.ParentNode.name -match 'Tests\.ps1$') {
                  $tc.ParentNode.name
                } else {
                  $defaultTestFile
                }
                if ($testFile -match 'tests[\\/][^\\/]+\.Tests\.ps1') {
                  $testFile = $matches[0] -replace '\\', '/'
                }
                Write-Host "::error file=$testFile,title=Pester Test Failure::$($tc.name): $msg"
              }
            }
          }

      - name: Upload Pester Test Results & Coverage Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact }}
          path: test-results/
          if-no-files-found: ignore

  psscriptanalyzer:
    name: PSScriptAnalyzer
    needs: [doc-lint, quality-gate-core, quality-gate-desktop]
    runs-on: windows-latest
    steps:
      - name: Confirm Status Check
        shell: pwsh
        run: Write-Host "PSScriptAnalyzer status check passed via quality-gate matrix suite."
