name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Master Quality Gate (AST, Lint, Line Endings, DryRun Smoke Test)
        shell: pwsh
        run: |
          ./scripts/Test-MasterGate.ps1

      - name: Run Diagnostic System State Auditor
        shell: pwsh
        run: |
          ./scripts/Measure-SystemState.ps1
